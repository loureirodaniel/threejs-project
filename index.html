<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Project</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 14px;
            z-index: 100;
        }
        
        /* Smooth scroll indicator */
        .smooth-scroll-indicator {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 255, 136, 0.9);
            color: black;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .smooth-scroll-indicator.show {
            opacity: 1;
        }
        
        /* Enhanced scroll feedback */
        .scroll-feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(0, 255, 136, 0.3);
            border: 2px solid rgba(0, 255, 136, 0.8);
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            scale: 0;
            transition: all 0.2s ease-out;
        }
        
        .scroll-feedback.active {
            opacity: 1;
            scale: 1;
        }
    </style>
</head>
<body>
    <div class="smooth-scroll-indicator" id="smoothScrollIndicator">
        Smooth Scrolling Active
    </div>
    <div class="scroll-feedback" id="scrollFeedback"></div>
    <script type="module" src="/src/main.js"></script>
    <script src="/demo-smooth-scroll.js"></script>
    <script src="/test-smooth-scroll.js"></script>
    <script src="/test-clean-scroll.js"></script>
</body>
</html>
