<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Timeline - Interactive Three.js Experience</title>
    <meta name="description" content="An immersive 3D timeline experience built with Three.js, featuring smooth camera transitions and interactive content.">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 14px;
            z-index: 100;
        }
        
        /* Smooth scroll indicator */
        .smooth-scroll-indicator {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 255, 136, 0.9);
            color: black;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .smooth-scroll-indicator.show {
            opacity: 1;
        }
        
        /* Enhanced scroll feedback */
        .scroll-feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(0, 255, 136, 0.3);
            border: 2px solid rgba(0, 255, 136, 0.8);
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            scale: 0;
            transition: all 0.2s ease-out;
        }
        
        .scroll-feedback.active {
            opacity: 1;
            scale: 1;
        }
    </style>
</head>
<body>
    <!-- Lenis scroll container for timeline year-by-year scroll (hidden, behind canvas) -->
    <div id="lenis-wrapper" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; overflow-y: scroll; overflow-x: hidden; z-index: -2; -webkit-overflow-scrolling: auto;">
        <div id="lenis-content" style="height: 1px;"></div>
    </div>
    <div class="smooth-scroll-indicator" id="smoothScrollIndicator">
        Smooth Scrolling Active
    </div>
    <div class="scroll-feedback" id="scrollFeedback"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
